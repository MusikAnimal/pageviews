security:
    providers:
        # Required by the bundle; the actual user comes from the
        # UserBadge loader in ApiTokenHandler.
        api_users:
            memory: { users: {} }

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        # The internal API accepts only our frontend's signed access
        # tokens — bar-raising against external scripting, not user
        # authentication (see ApiTokenIssuer).
        api:
            pattern: ^/api/
            stateless: true
            provider: api_users
            access_token:
                token_handler: App\Security\ApiTokenHandler
                # X-Api-Token first (Authorization gets stripped by
                # some CGI stacks); Bearer kept for tabs predating the
                # header switch.
                token_extractors:
                    - app.access_token_extractor
                    - header
                failure_handler: App\Security\ApiAuthFailureResponder
            entry_point: App\Security\ApiAuthFailureResponder
        # Everything else stays anonymous: the HTML shells (which embed
        # the token), the public cacheable JSON (/projects.json,
        # /siteinfo/*, /commons_categories.json — the shell preloads
        # the first, and <link rel="preload"> cannot carry a header)
        # and the /auth/token renewal endpoint.
        main:
            security: false

    access_control:
        # The OAuth milestone gates expensive endpoints ABOVE this
        # line, e.g. { path: ^/api/lists/, roles: ROLE_OAUTH }.
        - { path: ^/api/, roles: ROLE_FRONTEND }
