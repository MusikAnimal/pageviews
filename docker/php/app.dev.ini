; Development-only PHP settings (copied into the image by the Dockerfile).
memory_limit = 512M
display_errors = On
error_reporting = E_ALL

; Local requests to the AQS metrics API get rate-limited per IP (Cloud
; Services production is not subject to the same throttling), so large
; fan-outs legitimately take minutes here while retries wait out
; Retry-After. Production keeps the default 30s.
max_execution_time = 300

apc.enable_cli = 1

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
